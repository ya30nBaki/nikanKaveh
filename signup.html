<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت‌نام در سامانه</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">

<!-- هدر (از فایل js/header-footer.js میاد) -->
<div id="header"></div>


<!-- کارت ثبت نام (همون استایل صفحه ورود) -->
<div class="login">

  <!-- فرم ثبت نام -->
  <div class="login-form">
    <img src="img/logo.svg" class="login-logo" alt="لوگو">
    <h1>هنرستان نیکان کاوه <br><span>بناب</span></h1>

    <div class="login-title">
      <span></span>
      ثبت‌نام در سامانه
      <span></span>
    </div>

    <form action="#">
      <div class="input">
        <img src="img/icons/user.svg" alt="">
        <input type="text" placeholder="نام و نام خانوادگی">
      </div>

      <div class="input">
        <img src="img/icons/idcard.svg" alt="">
        <input type="text" placeholder="کد دانش‌آموزی یا کد پرسنلی">
      </div>

      <div class="input">
        <img src="img/icons/mobile.svg" alt="">
        <input type="tel" placeholder="شماره موبایل">
      </div>

      <div class="input">
        <img src="img/icons/lock.svg" alt="">
        <input type="password" placeholder="رمز عبور">
      </div>

      <div class="input">
        <img src="img/icons/lock.svg" alt="">
        <input type="password" placeholder="تکرار رمز عبور">
      </div>

      <button type="submit" class="login-btn">
        <img src="img/icons/white/sabtenam.svg" class="icon" alt=""> ثبت‌نام
      </button>
    </form>

    <p class="login-link">قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html">وارد شوید</a></p>
  </div>

  <!-- عکس کنار فرم -->
  <div class="login-pic">
    <p>آموزش، توانمندی، آینده‌ای روشن</p>
  </div>

  <!-- نوار پایین کارت -->
  <div class="login-footer">
    <p><img src="img/icons/white/school.svg" class="icon" alt=""> هنرستان نیکان کاوه بناب - سال تحصیلی ۱۴۰۵-۱۴۰۴</p>
    <a href="#"><img src="img/icons/white/poshtibani.svg" class="icon" alt=""> پشتیبانی سامانه</a>
  </div>

</div>


<!-- فوتر (از فایل js/header-footer.js میاد) -->
<div id="footer"></div>

</div>

<script src="js/header-footer.js"></script>
</body>
</html>
