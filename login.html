<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> ورود به سامانه | هنرستان نیکان کاوه بناب</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
  <div class="page">

    <!-- هدر (از فایل js/header-footer.js میاد) -->
    <div id="header"></div>


    <!-- کارت ورود -->
    <div class="login">

      <!-- فرم ورود -->
      <div class="login-form">
        <img src="./assets/img/logo.svg" class="login-logo" alt="لوگو">
        <h1>هنرستان نیکان کاوه <br><span>بناب</span></h1>

        <div class="login-title">
          <span></span>
          ورود به سامانه
          <span></span>
        </div>

        <form action="#">
          <div class="input">
            <img src="./assets/img/icons/user.svg" alt="">
            <input type="text" placeholder="نام کاربری (کد دانش‌آموزی یا کد پرسنلی)">
          </div>

          <div class="input">
            <img src="./assets/img/icons/lock.svg" alt="">
            <input type="password" placeholder="رمز عبور">
          </div>

          <label class="remember">
            <input type="checkbox"> مرا به خاطر بسپار
          </label>

          <button type="submit" class="login-btn">
            <img src="./assets/img/icons/white/login.svg" class="icon" alt=""> ورود
          </button>
        </form>

        <p class="login-note">
          <img src="./assets/img/icons/shield.svg" class="icon" alt="">
          فقط دانش‌آموزان و معلمان مجاز می‌توانند وارد سامانه شوند.
        </p>

        <p class="login-link">حساب کاربری ندارید؟ <a href="signup.html">ثبت‌نام کنید</a></p>
      </div>

      <!-- عکس کنار فرم -->
      <div class="login-pic">
        <p>آموزش، توانمندی، آینده‌ای روشن</p>
      </div>

      <!-- نوار پایین کارت -->
      <div class="login-footer">
        <p><img src="./assets/img/icons/white/school.svg" class="icon" alt=""> هنرستان نیکان کاوه بناب - سال تحصیلی
          ۱۴۰۵-۱۴۰۴</p>
        <a href="soon.html"><img src="./assets/img/icons/white/poshtibani.svg" class="icon" alt=""> پشتیبانی سامانه</a>
      </div>

    </div>


    <!-- فوتر (از فایل js/header-footer.js میاد) -->
    <div id="footer"></div>

  </div>

  <script src="./assets/js/header-footer.js"></script>
</body>

</html>
